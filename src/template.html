<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Word Game</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#2b2b2b;--bg:#f3f1f8;--lilac:#d9cff5;--blue:#cfe3ff;--pink:#ffd6e7;--green:#dff5d8;--yellow:#fff3c4;--peach:#ffe2cc;--good:#43a047;--bad:#e53935}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);font-family:"Fredoka","Trebuchet MS",sans-serif;color:var(--ink);min-height:100vh}
.wrap{max-width:760px;margin:0 auto;padding:16px}
.box{background:#fff;border:3px solid var(--ink);border-radius:18px;padding:18px}
header.top{background:var(--lilac);border:3px solid var(--ink);border-radius:16px;padding:10px 16px;display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:14px}
header.top h1{margin:0;font-size:26px}
.pill{background:#fff;border:2.5px solid var(--ink);border-radius:999px;padding:4px 14px;font-weight:700;font-size:18px;white-space:nowrap}
button{font-family:inherit;font-weight:700;font-size:20px;border:3px solid var(--ink);border-radius:14px;padding:10px 18px;cursor:pointer;background:#fff;color:var(--ink);box-shadow:0 4px 0 var(--ink);transition:transform .05s}
button:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
button:disabled{opacity:.45;cursor:default}
.b-blue{background:var(--blue)}.b-pink{background:var(--pink)}.b-green{background:var(--green)}.b-yellow{background:var(--yellow)}.b-peach{background:var(--peach)}
h2{margin:0 0 6px;font-size:24px}
p.sub{margin:0 0 14px;color:#555;font-size:16px}
.units{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin:10px 0 14px}
.unit{display:flex;align-items:center;gap:8px;border:2.5px solid var(--ink);border-radius:12px;padding:8px 10px;cursor:pointer;font-size:16px;user-select:none;background:#fff}
.unit input{width:20px;height:20px;accent-color:#7e57c2}
.unit.on{background:var(--yellow)}
.unit small{color:#666;display:block;font-size:12px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row label{font-size:17px}
select{font-family:inherit;font-size:18px;border:2.5px solid var(--ink);border-radius:10px;padding:6px 8px;background:#fff}
.meaning{font-size:30px;line-height:1.3;font-weight:600;text-align:center;margin:6px 0 4px;min-height:80px}
.blanks{text-align:center;font-size:30px;letter-spacing:8px;color:#7e57c2;margin:6px 0 10px}
.pic{display:flex;justify-content:center;margin:6px 0 10px;min-height:0}
.pic svg{width:220px;height:200px}
.pic.hidden{display:none}
input.ans{font-family:inherit;font-size:34px;font-weight:700;text-align:center;width:100%;border:3px solid var(--ink);border-radius:14px;padding:10px;outline:none;text-transform:lowercase}
input.ans:focus{background:#fffde7}
.actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:14px}
.feedback{text-align:center;font-size:28px;font-weight:700;min-height:40px;margin-top:10px}
.feedback.good{color:var(--good)}.feedback.bad{color:var(--bad)}
.shake{animation:shake .35s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.pop{animation:pop .4s}
@keyframes pop{50%{transform:scale(1.08)}}
.progress{height:14px;border:2.5px solid var(--ink);border-radius:999px;overflow:hidden;background:#fff;margin-bottom:12px}
.progress div{height:100%;background:#9ccc65;width:0;transition:width .3s}
.results{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px;margin-top:12px}
.res{border:2.5px solid var(--ink);border-radius:12px;text-align:center;padding:6px;background:#fff}
.res svg{width:80px;height:72px}
.res b{display:block;font-size:17px}
.res span{font-size:13px}
.res.g2{background:var(--green)}.res.g1{background:var(--yellow)}.res.g0{background:var(--pink)}
.big{font-size:60px;text-align:center;margin:6px 0}
.legend{font-size:15px;color:#555;text-align:center;margin-top:6px}
.hide{display:none!important}
.example{text-align:center;font-size:24px;font-weight:600;background:var(--yellow);border:2.5px solid var(--ink);border-radius:12px;padding:8px 12px;margin:6px auto 10px;max-width:560px}
.example b{color:#7e57c2;text-decoration:underline}
.example.hidden{display:none}
.opts{display:flex;flex-direction:column;gap:8px;margin:12px 0}
.opt{display:flex;align-items:center;gap:10px;border:2.5px solid var(--ink);border-radius:12px;padding:8px 12px;font-size:18px;cursor:pointer;background:#fff}
.opt input{width:22px;height:22px;accent-color:#7e57c2}
.opt small{color:#666;font-size:13px;display:block}
.slots{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;margin:8px 0 4px;position:relative;cursor:text}
.slot{width:46px;height:58px;border:3px solid var(--ink);border-radius:10px;background:#fff;display:flex;align-items:center;justify-content:center;font-size:34px;font-weight:700;text-transform:lowercase}
.slot.cur{border-color:#7e57c2;box-shadow:0 0 0 3px #d1c4e9}
.slot.ok{background:#c8e6c9;border-color:var(--good)}
.slot.no{background:#ffcdd2;border-color:var(--bad)}
.slot.gap{width:18px;border:none;background:none}
.slot.sym{border:none;background:none;width:20px}
.letters{display:flex;justify-content:center;gap:4px;min-height:34px;font-size:28px;font-weight:700;margin-top:6px}
.letters span{padding:0 4px;border-radius:6px}
.letters .ok{background:#c8e6c9;color:#1b5e20}.letters .no{background:#ffcdd2;color:#b71c1c}
#form{position:relative}
input.ans.ghost{position:absolute;top:0;left:0;width:100%;height:66px;opacity:0;caret-color:transparent;padding:0;border:0}
@media (max-width:520px){.slot{width:34px;height:46px;font-size:26px}}
@media (max-width:520px){.meaning{font-size:24px}input.ans{font-size:28px}button{font-size:18px;padding:9px 14px}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top"><h1>Word Game</h1><span class="pill" id="scorePill">★ 0</span></header>

  <!-- SETUP -->
  <section id="setup" class="box">
    <h2>Which weeks?</h2>
    <p class="sub">Words from her notebook, newest first. Tick one week, or several to review.</p>
    <div class="row">
      <button class="b-blue" id="wkAll" type="button">All weeks</button>
      <button class="b-peach" id="wkNone" type="button">None</button>
    </div>
    <div class="units" id="weeks"></div>
    <details id="bookSec" style="margin-top:12px;border:2.5px solid var(--ink);border-radius:12px;padding:8px 12px;background:#fff">
    <summary style="font-size:20px;font-weight:700;cursor:pointer">Book pages (optional)</summary>
    <p class="sub" style="margin-top:8px">Add words from the textbook to the game.</p>
    <div class="row">
      <button class="b-blue" id="allBtn" type="button">All</button>
      <button class="b-peach" id="noneBtn" type="button">None</button>
      <label>Up to page
        <select id="upTo"></select>
      </label>
    </div>
    <div class="units" id="units"></div>
    </details>
    <div class="row">
      <label>How many words?
        <select id="howMany"><option>5</option><option selected>10</option><option>15</option><option>20</option><option value="999">All</option></select>
      </label>
      <span id="countInfo" style="color:#555"></span>
    </div>
    <h2 style="margin-top:6px">Game options</h2>
    <div class="opts">
      <label class="opt"><input type="checkbox" id="optSlots" checked><span>Letter boxes<small>One box per letter. Each letter goes into its own box.</small></span></label>
      <label class="opt"><input type="checkbox" id="optCheck" checked><span>Show right and wrong letters<small>Each letter turns green if it is right, red if it is wrong.</small></span></label>
    </div>
    <div class="actions"><button class="b-green" id="startBtn" style="font-size:26px">▶ Start</button></div>
    <p class="legend">Guess from the meaning = 2 stars · with a hint (example or picture) = 1 star · skip = 0</p>
  </section>

  <!-- PLAY -->
  <section id="play" class="box hide">
    <div class="progress"><div id="bar"></div></div>
    <div class="row" style="justify-content:space-between;margin-bottom:6px">
      <span class="pill" id="turnPill">1 / 10</span>
      <button class="b-yellow" id="speakBtn" type="button" title="Read it to me">🔊 Read</button>
    </div>
    <div class="meaning" id="meaning"></div>
    <div class="blanks" id="blanks"></div>
    <div class="example hidden" id="ex"></div><div class="pic hidden" id="pic"></div>
    <form id="form" autocomplete="off">
      <div class="slots hide" id="slots"></div><input class="ans" id="ans" placeholder="type the word" autocapitalize="off" autocorrect="off" spellcheck="false"><div class="letters hide" id="letters"></div>
      <div class="actions">
        <button class="b-yellow" id="exBtn" type="button">💬 Example</button><button class="b-blue" id="picBtn" type="button">🖼 Show picture</button>
        <button class="b-green" id="checkBtn" type="submit">✔ Check</button>
        <button class="b-peach" id="skipBtn" type="button">Skip ➜</button>
      </div>
    </form>
    <div class="feedback" id="fb"></div>
    <div class="actions"><button class="b-green hide" id="nextBtn" type="button">Next ➜</button></div>
  </section>

  <!-- END -->
  <section id="end" class="box hide">
    <div class="big" id="endEmoji">🎉</div>
    <h2 style="text-align:center" id="endTitle"></h2>
    <p class="sub" style="text-align:center" id="endSub"></p>
    <div class="actions"><button class="b-green" id="againBtn">Play again</button><button class="b-blue" id="menuBtn">Change pages</button></div>
    <div class="results" id="results"></div>
  </section>
</div>

<script>
const WORDS=/*BOOK_DATA*/;
const UNITS=/*UNITS_DATA*/;
const WEEKS=/*WEEKS_DATA*/;
const $=id=>document.getElementById(id);
let deck=[],i=0,score=0,usedPic=false,done=false,log=[];let SLOTS=true,CHECK=true;

// ---- setup screen
const unitsEl=$('units');
UNITS.forEach((u,k)=>{
  const l=document.createElement('label');l.className='unit on';
  l.innerHTML=`<input type="checkbox" checked data-k="${k}"><span>${u.n}<small>pages ${u.a}–${u.b} · ${u.c} words</small></span>`;
  unitsEl.appendChild(l);
});
const weeksEl=$('weeks');
WEEKS.forEach((w,k)=>{
  const l=document.createElement('label');l.className='unit';
  l.innerHTML=`<input type="checkbox" data-w="${k}" ${k===0?'checked':''}><span>${w.label}<small>${w.words.length} words</small></span>`;
  weeksEl.appendChild(l);
});
const wboxes=()=>[...weeksEl.querySelectorAll('input')];
weeksEl.addEventListener('change',refresh);
$('wkAll').onclick=()=>{wboxes().forEach(b=>b.checked=true);refresh()};
$('wkNone').onclick=()=>{wboxes().forEach(b=>b.checked=false);refresh()};
// when weeks exist, start with only the newest week ticked
if(WEEKS.length)setTimeout(()=>{[...unitsEl.querySelectorAll('input')].forEach(b=>b.checked=false);refresh()},0);
const boxes=()=>[...unitsEl.querySelectorAll('input')];
function refresh(){[...boxes(),...wboxes()].forEach(b=>b.parentElement.classList.toggle('on',b.checked));
  const n=pool().length;$('countInfo').textContent=n+' words picked';$('startBtn').disabled=!n;}
unitsEl.addEventListener('change',refresh);
$('allBtn').onclick=()=>{boxes().forEach(b=>b.checked=true);refresh()};
$('noneBtn').onclick=()=>{boxes().forEach(b=>b.checked=false);refresh()};
const up=$('upTo');up.innerHTML='<option value="">—</option>'+[...new Set(WORDS.map(w=>w.p))].map(p=>`<option>${p}</option>`).join('');
up.onchange=()=>{const p=+up.value;if(!p)return;boxes().forEach((b,k)=>b.checked=UNITS[k].a<=p);refresh()};
function pool(){const on=boxes().filter(b=>b.checked).map(b=>UNITS[b.dataset.k]);
  const lim=+up.value||999;
  const book=WORDS.filter(w=>on.some(u=>w.p>=u.a&&w.p<=u.b)&&w.p<=lim);
  const wk=wboxes().filter(b=>b.checked).flatMap(b=>WEEKS[b.dataset.w].words);
  const seen=new Set(),out=[];
  for(const w of [...wk,...book]){const k=w.w.toLowerCase();if(!seen.has(k)){seen.add(k);out.push(w)}}
  return out;}
refresh();

// ---- game
const norm=s=>s.toLowerCase().replace(/[^a-z]/g,'');
function shuffle(a){for(let k=a.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[a[k],a[j]]=[a[j],a[k]]}return a}
function show(id){['setup','play','end'].forEach(s=>$(s).classList.toggle('hide',s!==id))}
function start(){SLOTS=$('optSlots').checked;CHECK=$('optCheck').checked;deck=shuffle(pool().slice()).slice(0,+$('howMany').value);i=0;score=0;log=[];setScore();show('play');turn();}
function setScore(){$('scorePill').textContent='★ '+score}
function blanks(w){return w.split('').map(c=>/[a-z]/i.test(c)?'_':c===' '?'  ':c).join(' ')}
function turn(){
  const w=deck[i];usedPic=false;done=false;
  $('turnPill').textContent=(i+1)+' / '+deck.length;
  $('bar').style.width=(i/deck.length*100)+'%';
  $('meaning').textContent=w.m;$('blanks').textContent=blanks(w.w);
  $('pic').innerHTML=w.s;$('pic').classList.add('hidden');
  $('ans').value='';$('ans').disabled=false;setupInput(w);$('fb').textContent='';$('fb').className='feedback';
  ['exBtn','picBtn','checkBtn','skipBtn'].forEach(b=>$(b).disabled=false);$('ex').classList.add('hidden');$('exBtn').classList.toggle('hide',!w.e);
  $('nextBtn').classList.add('hide');$('ans').focus();
}
// ---- example sentence
function exRe(w){return new RegExp('(^|[^A-Za-z])('+w.w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')(?![A-Za-z])','i')}
function esc(t){return t.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}
function showEx(full){const w=deck[i];if(!w.e)return;
  const re=exRe(w),m=w.e.match(re);let h=esc(w.e);
  if(m){const a=esc(w.e.slice(0,m.index+m[1].length)),b=esc(w.e.slice(m.index+m[0].length));
    h=a+(full?'<b>'+esc(m[2])+'</b>':'_____')+b;}
  $('ex').innerHTML=h;$('ex').classList.remove('hidden');}
$('exBtn').onclick=()=>{usedPic=true;showEx(false);$('exBtn').disabled=true;$('ans').focus();};
$('picBtn').onclick=()=>{usedPic=true;$('pic').classList.remove('hidden');$('pic').classList.add('pop');$('picBtn').disabled=true;$('ans').focus();};
$('form').onsubmit=e=>{e.preventDefault();if(done)return next();
  const w=deck[i],a=$('ans').value;if(!a.trim())return;
  if(norm(a)===norm(w.w)){const pts=usedPic?1:2;score+=pts;setScore();finish(pts,'Yes! '+'⭐'.repeat(pts),'good');}
  else{$('fb').textContent='Not quite, try again!';$('fb').className='feedback bad';$('ans').classList.remove('shake');void $('ans').offsetWidth;$('ans').classList.add('shake');$('ans').select();if(SLOTS){$('slots').classList.remove('shake');void $('slots').offsetWidth;$('slots').classList.add('shake');}}
};
$('skipBtn').onclick=()=>finish(0,'It was: '+deck[i].w,'bad');
function finish(pts,msg,cls){done=true;log.push({w:deck[i],pts});
  $('pic').classList.remove('hidden');$('ans').value=SLOTS?letters(deck[i].w):deck[i].w;$('ans').disabled=true;render();
  $('fb').textContent=msg;$('fb').className='feedback '+cls;
  ['exBtn','picBtn','checkBtn','skipBtn'].forEach(b=>$(b).disabled=true);showEx(true);
  $('nextBtn').classList.remove('hide');$('nextBtn').focus();say(deck[i].w+'. '+(deck[i].e||''));}
function next(){i++;if(i<deck.length)turn();else end();}
$('nextBtn').onclick=next;
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&done&&!$('play').classList.contains('hide')){e.preventDefault();next();}});
function end(){$('bar').style.width='100%';show('end');
  const max=deck.length*2,pct=score/max;
  $('endEmoji').textContent=pct>=.8?'🏆':pct>=.5?'🎉':'👍';
  $('endTitle').textContent=`You got ${score} of ${max} stars!`;
  $('endSub').textContent=`${log.filter(l=>l.pts===2).length} without the picture · ${log.filter(l=>l.pts===1).length} with the picture · ${log.filter(l=>!l.pts).length} skipped`;
  $('results').innerHTML=log.map(l=>`<div class="res g${l.pts}">${l.w.s}<b>${l.w.w}</b><span>${'⭐'.repeat(l.pts)||'skipped'}</span></div>`).join('');}
$('startBtn').onclick=start;$('againBtn').onclick=start;$('menuBtn').onclick=()=>{score=0;setScore();show('setup')};
// ---- letter boxes / letter checking
const letters=w=>w.toLowerCase().replace(/[^a-z]/g,'');
function setupInput(w){
  const L=letters(w.w);
  $('blanks').classList.toggle('hide',SLOTS);
  $('slots').classList.toggle('hide',!SLOTS);
  $('letters').classList.toggle('hide',SLOTS||!CHECK);
  $('ans').classList.toggle('ghost',SLOTS);
  $('ans').maxLength=SLOTS?L.length:60;
  render();
}
function render(){
  const w=deck[i];if(!w)return;const L=letters(w.w);
  let v=$('ans').value;
  if(SLOTS){v=letters(v).slice(0,L.length);if($('ans').value!==v)$('ans').value=v;
    let k=0,h='';
    for(const c of w.w){
      if(/[a-z]/i.test(c)){const t=v[k]||'';let cls='slot';
        if(t&&CHECK)cls+=t===L[k]?' ok':' no';
        if(!done&&k===v.length)cls+=' cur';
        h+=`<div class="${cls}">${t}</div>`;k++;}
      else h+=c===' '?'<div class="slot gap"></div>':`<div class="slot sym">${c}</div>`;}
    $('slots').innerHTML=h;
  }else if(CHECK){const t=letters(v);
    $('letters').innerHTML=[...t].map((c,k)=>`<span class="${c===L[k]?'ok':'no'}">${c}</span>`).join('');}
}
$('ans').addEventListener('input',render);
$('slots').addEventListener('click',()=>$('ans').focus());
// ---- read aloud
function say(t){try{const u=new SpeechSynthesisUtterance(t);u.lang='en-GB';u.rate=.85;speechSynthesis.cancel();speechSynthesis.speak(u);}catch(e){}}
$('speakBtn').onclick=()=>say(deck[i].m.replace(/___/g,'blank'));
if(!('speechSynthesis' in window))$('speakBtn').classList.add('hide');
</script>
</body>
</html>
